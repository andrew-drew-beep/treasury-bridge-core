[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treasury-bridge-core"
version = "0.1.0"
description = "Synthetic bank-to-ledger reconciliation and human review demonstration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]

[project.scripts]
treasury-bridge = "treasury_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
treasury_bridge = ["web/*.html", "web/*.css", "web/*.js"]
